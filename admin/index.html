<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>문의함 — 과학드론 교구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --night: #151036; --panel: #211a4a; --line: #3a3270; --violet: #9c80ff; --cyan: #72e0e6; --text: #eeebf8; --muted: #aba5cc; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--night); color: var(--text); font: 400 16px/1.6 "IBM Plex Sans KR", system-ui, sans-serif; word-break: keep-all; }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 24px; }
  input[type=password] { width: 100%; min-height: 52px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; }
  button { font: 600 16px "IBM Plex Sans KR", sans-serif; min-height: 48px; padding: 0 20px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--text); cursor: pointer; }
  .primary { background: var(--text); color: var(--night); border: 0; width: 100%; margin-top: 12px; }
  .err { color: #ffb4c0; min-height: 1.6em; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 24px; }
  .count { font-size: 15px; color: var(--muted); }
  .count strong { display: block; font-size: 44px; line-height: 1.1; color: var(--text); font-weight: 600; }
  .list { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  .item { background: var(--panel); border-radius: 16px; padding: 18px; border: 1px solid transparent; }
  .item.new { border-color: var(--violet); }
  .meta { color: var(--muted); font-size: 14px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .kind { color: var(--cyan); font-weight: 500; }
  .name { font-size: 18px; font-weight: 600; margin: 6px 0 2px; }
  .contact { background: none; border: 0; padding: 0; min-height: 40px; color: var(--text); text-decoration: underline; text-underline-offset: 4px; font-weight: 400; }
  .org { color: var(--muted); }
  .states { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .states button { padding: 0 8px; }
  .states button[aria-pressed=true] { background: var(--violet); border-color: var(--violet); color: var(--night); }
  .empty { color: var(--muted); text-align: center; padding: 48px 0; }
  .src { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .src b { color: var(--text); font-weight: 500; }
  .panel { background: var(--panel); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
  .panel h2 { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
  .bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .bars li { display: grid; grid-template-columns: 7.5em 1fr 2.5em; gap: 10px; align-items: center; font-size: 15px; }
  .bars .bar { height: 10px; border-radius: 5px; background: var(--violet); min-width: 4px; }
  .bars .n { text-align: right; color: var(--muted); }
  details.panel summary { cursor: pointer; font-weight: 600; min-height: 32px; }
  .builder { display: grid; gap: 12px; margin-top: 12px; }
  .builder label { display: grid; gap: 6px; font-size: 15px; }
  .builder select, .builder input { min-height: 48px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--night); color: var(--text); font: inherit; }
  .out { word-break: break-all; background: var(--night); border-radius: 10px; padding: 12px; font-size: 14px; color: var(--cyan); }
  .hint { color: var(--muted); font-size: 14px; margin: 0; }
</style>
</head>
<body>
<main>
  <section id="login">
    <h1>문의함</h1>
    <form id="loginForm">
      <label for="pw">관리자 비밀번호</label>
      <input type="password" id="pw" autocomplete="current-password" required>
      <button class="primary" type="submit">들어가기</button>
      <p class="err" id="loginErr" role="alert"></p>
    </form>
  </section>

  <section id="box" hidden>
    <div class="head">
      <div class="count">새 문의<strong id="newCount">0</strong></div>
      <div>
        <button type="button" id="reload">새로고침</button>
        <button type="button" id="logout">나가기</button>
      </div>
    </div>
    <p class="err" id="boxErr" role="alert"></p>

    <section class="panel" id="sources" hidden>
      <h2>어디서 와서 문의했나요</h2>
      <ul class="bars" id="bars"></ul>
    </section>

    <details class="panel">
      <summary>추적 링크 만들기 (UTM)</summary>
      <div class="builder">
        <label>어디에 올릴 링크인가요?
          <select id="bSource">
            <option value="instagram|social">인스타그램</option>
            <option value="youtube|video">유튜브</option>
            <option value="naver_blog|blog">네이버 블로그</option>
            <option value="qr|offline">연수·박람회 QR 코드</option>
            <option value="kakao|message">카카오톡 공유</option>
            <option value="email|email">이메일·공문</option>
          </select>
        </label>
        <label>행사나 게시물 이름 <span class="hint">(영문·숫자, 예: 2026_fall_expo)</span>
          <input type="text" id="bCampaign" autocomplete="off" maxlength="60">
        </label>
        <div class="out" id="bOut"></div>
        <button type="button" id="bCopy">링크 복사</button>
        <p class="hint">이 링크로 들어와 30일 안에 문의하면, 위 목록과 문의 카드에 어디서 왔는지 표시돼요.</p>
      </div>
    </details>

    <ul class="list" id="list"></ul>
  </section>
</main>

<script>
  const STATUSES = ['새 문의', '연락함', '완료'];
  const $ = (id) => document.getElementById(id);
  const getPw = () => sessionStorage.getItem('adminPw') || '';

  async function api(method, body) {
    const r = await fetch('/api/admin', {
      method,
      headers: { 'x-admin-password': getPw(), 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await r.json().catch(() => ({}));
    if (r.status === 401) { showLogin('비밀번호가 맞지 않아요.'); throw new Error(''); }
    if (!r.ok) throw new Error(data.error || '불러오지 못했어요.');
    return data;
  }

  function showLogin(message) {
    sessionStorage.removeItem('adminPw');
    $('box').hidden = true; $('login').hidden = false;
    $('loginErr').textContent = message || '';
    $('pw').value = ''; $('pw').focus();
  }

  const fmt = (s) => new Date(s).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });

  const SOURCE_NAMES = { instagram: '인스타그램', youtube: '유튜브', naver_blog: '네이버 블로그', qr: '연수·박람회 QR', kakao: '카카오톡', email: '이메일·공문' };
  // 문의 한 건이 어디서 왔는지 사람이 읽는 이름으로
  function sourceOf(row) {
    if (row.utm_source) return SOURCE_NAMES[row.utm_source] || row.utm_source;
    if (row.referrer) {
      if (/naver\./.test(row.referrer)) return '네이버 검색·유입';
      if (/google\./.test(row.referrer)) return '구글 검색';
      return row.referrer;
    }
    return '직접 방문·알 수 없음';
  }

  function renderSources(rows) {
    const counts = {};
    for (const r of rows) { const s = sourceOf(r); counts[s] = (counts[s] || 0) + 1; }
    const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]);
    $('sources').hidden = !entries.length;
    const max = Math.max(1, ...entries.map((e) => e[1]));
    const bars = $('bars'); bars.textContent = '';
    for (const [name, n] of entries) {
      const li = document.createElement('li');
      const label = document.createElement('span'); label.textContent = name;
      const bar = document.createElement('span'); bar.className = 'bar'; bar.style.width = (n / max * 100) + '%';
      const num = document.createElement('span'); num.className = 'n'; num.textContent = n + '건';
      li.append(label, bar, num); bars.append(li);
    }
  }

  function render(rows) {
    $('newCount').textContent = rows.filter((r) => r.status === '새 문의').length;
    renderSources(rows);
    const list = $('list');
    list.textContent = '';
    if (!rows.length) { list.innerHTML = '<li class="empty">아직 들어온 문의가 없어요.</li>'; return; }
    for (const row of rows) {
      const li = document.createElement('li');
      li.className = 'item' + (row.status === '새 문의' ? ' new' : '');
      const meta = document.createElement('div'); meta.className = 'meta';
      const kind = document.createElement('span'); kind.className = 'kind'; kind.textContent = row.kind || '';
      const date = document.createElement('span'); date.textContent = fmt(row.created_at);
      meta.append(kind, date);
      const name = document.createElement('div'); name.className = 'name'; name.textContent = row.name;
      const contact = document.createElement('button'); contact.type = 'button'; contact.className = 'contact'; contact.textContent = row.contact;
      contact.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(row.contact); contact.textContent = row.contact + ' (복사했어요)'; setTimeout(() => (contact.textContent = row.contact), 1500); }
        catch { const s = getSelection(); const rg = document.createRange(); rg.selectNodeContents(contact); s.removeAllRanges(); s.addRange(rg); }
      });
      const org = document.createElement('div'); org.className = 'org'; org.textContent = row.org || '소속 없음';
      const states = document.createElement('div'); states.className = 'states';
      for (const st of STATUSES) {
        const b = document.createElement('button'); b.type = 'button'; b.textContent = st;
        b.setAttribute('aria-pressed', String(row.status === st));
        b.addEventListener('click', async () => {
          if (row.status === st) return;
          try { await api('PATCH', { id: row.id, status: st }); load(); } catch (e) { if (e.message) $('boxErr').textContent = e.message; }
        });
        states.append(b);
      }
      const src = document.createElement('div'); src.className = 'src';
      const srcName = document.createElement('b'); srcName.textContent = sourceOf(row);
      src.append('유입: ', srcName);
      if (row.utm_campaign) src.append(' · ' + row.utm_campaign);
      li.append(meta, name, contact, org, src, states);
      list.append(li);
    }
  }

  async function load() {
    $('boxErr').textContent = '';
    try {
      const { rows } = await api('GET');
      $('login').hidden = true; $('box').hidden = false;
      render(rows);
    } catch (e) { if (e.message) { $('login').hidden = true; $('box').hidden = false; $('boxErr').textContent = e.message; } }
  }

  $('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    sessionStorage.setItem('adminPw', $('pw').value);
    $('loginErr').textContent = '';
    load();
  });
  function buildLink() {
    const [source, medium] = $('bSource').value.split('|');
    const campaign = $('bCampaign').value.trim().toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_-]/g, '');
    const u = new URL('/', location.origin);
    u.searchParams.set('utm_source', source);
    u.searchParams.set('utm_medium', medium);
    if (campaign) u.searchParams.set('utm_campaign', campaign);
    $('bOut').textContent = u.toString();
  }
  $('bSource').addEventListener('change', buildLink);
  $('bCampaign').addEventListener('input', buildLink);
  $('bCopy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText($('bOut').textContent); $('bCopy').textContent = '복사했어요'; }
    catch { const s = getSelection(); const rg = document.createRange(); rg.selectNodeContents($('bOut')); s.removeAllRanges(); s.addRange(rg); $('bCopy').textContent = '선택했어요. 복사해 주세요'; }
    setTimeout(() => ($('bCopy').textContent = '링크 복사'), 1800);
  });
  buildLink();

  $('reload').addEventListener('click', load);
  $('logout').addEventListener('click', () => showLogin(''));
  if (getPw()) load(); else $('pw').focus();
</script>
</body>
</html>
